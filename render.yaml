# The API on Render's free plan. The web app runs on Vercel and calls it at API_BASE_URL.
# Durable state uses external Postgres (Neon); no application disk is required.
# A free instance stops after 15 idle minutes; pages wake it and show a banner while it starts.
services:
  - type: web
    name: maxx-api
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      # Judges must see Nemotron on Token Factory. The room says so if the replay ever stands in.
      - key: SCAN_MODE
        value: live
      - key: NEGOTIATION_MODE
        value: live
      - key: MATCH_MODE
        value: live
      - key: NEGOTIATION_REPLAY_FALLBACK
        value: "true"
      # Judging window: a larger daily share; AI_BUDGET_USD still caps the total spend.
      - key: AI_DAILY_BUDGET_USD
        value: "3"
      - key: AI_NEGOTIATION_DAILY_BUDGET_USD
        value: "2"
      - key: AI_OWNER_NEGOTIATION_DAILY_BUDGET_USD
        value: "0.30"
      - key: AI_USER_DAILY_BUDGET_USD
        value: "0.15"
      - key: AI_ANONYMOUS_DAILY_BUDGET_USD
        value: "0.30"
      # The demo money and seller tour run on the labelled simulators.
      - key: PAYPAL_MODE
        value: simulator
      - key: DEMO_TOOLS
        value: "true"
      # Production refuses to start otherwise; the seller tour marks its demo shop as reviewed.
      - key: SELLER_REVIEW
        value: manual
      # One-tap judge entry on /judge; share the code only in the judging notes.
      - key: JUDGE_ACCESS_CODE
        sync: false
      - key: SIMULATOR_WEBHOOK_SECRET
        generateValue: true
      - key: WORKER_ENABLED
        value: "true"
      - key: BLOC_OPEN_SECONDS
        value: "3600"
      - key: DATABASE_URL
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      # The web app reaches this API through its public address, so the visitor's address travels in
      # x-maxx-client-ip; set the same secret on the web app, or every visitor shares one allowance.
      - key: PROXY_CLIENT_IP_SECRET
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      # Accounts: PUBLIC_BASE_URL is the web app's https address (cookies and OAuth need it).
      - key: PUBLIC_BASE_URL
        sync: false
      - key: EMAIL_MODE
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT
        value: common
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
