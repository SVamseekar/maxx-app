# Preparation only. Creating these services requires operator action.
# Durable state uses external Postgres; no application disk is required.
services:
  - type: web
    name: maxx-api
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      # Judges must see Nemotron on Token Factory. The room says so if the replay ever stands in.
      - key: SCAN_MODE
        value: live
      - key: NEGOTIATION_MODE
        value: live
      - key: MATCH_MODE
        value: live
      - key: NEGOTIATION_REPLAY_FALLBACK
        value: "true"
      # Judging window: a larger daily share; AI_BUDGET_USD still caps the total spend.
      - key: AI_DAILY_BUDGET_USD
        value: "3"
      - key: AI_NEGOTIATION_DAILY_BUDGET_USD
        value: "2"
      - key: AI_OWNER_NEGOTIATION_DAILY_BUDGET_USD
        value: "0.30"
      - key: AI_USER_DAILY_BUDGET_USD
        value: "0.15"
      - key: AI_ANONYMOUS_DAILY_BUDGET_USD
        value: "0.30"
      # The demo money and seller tour run on the labelled simulators.
      - key: PAYPAL_MODE
        value: simulator
      - key: DEMO_TOOLS
        value: "true"
      # One-tap judge entry on /judge; share the code only in the judging notes.
      - key: JUDGE_ACCESS_CODE
        sync: false
      - key: SIMULATOR_WEBHOOK_SECRET
        generateValue: true
      - key: WORKER_ENABLED
        value: "true"
      - key: BLOC_OPEN_SECONDS
        value: "3600"
      - key: DATABASE_URL
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      # Accounts: set PUBLIC_BASE_URL to the maxx-web https address before enabling sign-in.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: EMAIL_MODE
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT
        value: common
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
  - type: web
    name: maxx-web
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile.web
    dockerContext: .
    autoDeployTrigger: off
    envVars:
      # Use the API's private-network address (http://<api-host>:<port>), not its public URL. The API
      # takes the last X-Forwarded-For entry as the client; through the public URL that entry would be
      # this web service's own address, and every visitor would share one rate-limit allowance.
      - key: API_BASE_URL
        sync: false
      # Read by Next.js for the Content-Security-Policy and HSTS.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
