services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maxx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxx_local}
      POSTGRES_DB: ${POSTGRES_DB:-maxx}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-maxx}:${POSTGRES_PASSWORD:-maxx_local}@db:5432/${POSTGRES_DB:-maxx}
      PORT: "8000"
      WEB_CONCURRENCY: "1"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      API_BASE_URL: http://api:8000
      PORT: "3001"
    ports: ["127.0.0.1:3001:3001"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres-data:
